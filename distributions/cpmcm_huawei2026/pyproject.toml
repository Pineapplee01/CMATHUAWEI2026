[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpmcm-huawei2026"
version = "0.1.0"
description = "Standalone code distribution for the CPMCM Huawei Cup 2026 multimodal emotion project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.6",
]

[project.optional-dependencies]
runtime = [
  "torch>=2.6",
  "transformers>=4.46",
  "scipy>=1.15",
  "matplotlib>=3.10",
  "openpyxl>=3.1",
  "safetensors>=0.7",
  "seaborn>=0.13",
  "opencv-python-headless>=4.10",
]
preprocessing = [
  "soundfile>=0.13",
  "praatio>=6.2",
]
test = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cpmcm_huawei2026.preprocessing.problem1" = ["*.json"]
"cpmcm_huawei2026.prediction" = ["*.json"]
"cpmcm_huawei2026.explanation" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
