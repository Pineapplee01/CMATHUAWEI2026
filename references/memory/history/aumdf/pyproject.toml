[project]
name = "aumdf-e-reproduction"
version = "0.1.0"
description = "Independent, paper-grounded AUMDF reproduction adapted to E题 features"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "torch>=2.1", "PyYAML>=6"]

[tool.pytest.ini_options]
pythonpath = [".", "../../src"]
testpaths = ["tests"]
addopts = "-ra"
