# Project-owned registry for comparison methods synchronized to the remote repo.
# Third-party snapshots remain local and are referenced by references/code_manifest.json.
schema_version: 1
protocol_version: e-competition-v1
deferred_clusters:
  - id: L0
    name: lower_bound
    reason: "暂不实现；不作为首轮必做基线"
sync_scope: [L1, L2, L3, L4, L5, L6]
clusters:
  L1:
    name: direct_fusion
    task: [Q2, Q3]
    variant: aligned
    methods:
      - {id: concat_mlp, display_name: Concat-MLP, status: planned, source: project_owned}
      - {id: ef_lstm, display_name: EF-LSTM, status: local_reference, source: references/MMSA/src/MMSA/models/singleTask/EF_LSTM.py}
      - {id: early_fusion_gru, display_name: Early Fusion + GRU, status: planned, source: project_owned}
  L2:
    name: classical_interaction
    task: [Q2, Q3]
    variant: aligned
    methods:
      - {id: tfn, display_name: TFN, status: local_reference, source: references/MMSA/src/MMSA/models/singleTask/TFN.py}
      - {id: mfn, display_name: MFN, status: local_reference, source: references/MMSA/src/MMSA/models/singleTask/MFN.py}
      - {id: graph_mfn_dfg, display_name: Graph-MFN/DFG, status: local_reference, source: references/MMSA/src/MMSA/models/singleTask/Graph_MFN.py}
  L3:
    name: unaligned_cross_modal_attention
    task: [Q2, Q3]
    variant: unaligned
    methods:
      - id: mult
        display_name: MulT
        status: local_reference
        source: references/MMSA/src/MMSA/models/singleTask/MULT.py
        upstream: https://github.com/yaohungt/Multimodal-Transformer
  L4:
    name: missing_modality_robustness
    task: [Q2]
    methods:
      - {id: masked_train, display_name: Masked-Train control, status: planned, source: project_owned}
      - {id: p_rmf, display_name: P-RMF, status: local_reference, variant: unaligned, source: references/P-RMF}
      - {id: cmad, display_name: CMAD, status: local_reference, variant: aligned, source: references/CMAD}
      - {id: aumdf, display_name: AUMDF, status: adapted_baseline, variant: aligned, source: references/AUMDF}
  L5:
    name: reliability_dynamic_experts
    task: [Q2, Q3]
    variant: aligned
    methods:
      - {id: emoe, display_name: EMOE, status: local_reference, source: references/EMOE}
      - {id: qa_moe, display_name: QA-MoE, status: local_reference, source: references/QA-MoE}
      - {id: cica, display_name: CICA, status: paper_only, source: references/reference.md}
  L6:
    name: explainable_interaction
    task: [Q3]
    variant: aligned
    methods:
      - {id: graph_mfn_dfg_attribution, display_name: Graph-MFN/DFG + attribution, status: local_reference_plus_project_diagnostics, source: references/MMSA/src/MMSA/models/singleTask/Graph_MFN.py}
      - {id: emoe_attribution, display_name: EMOE + attribution, status: local_reference_plus_project_diagnostics, source: references/EMOE}
      - {id: permutation_occlusion, display_name: Permutation/Occlusion attribution, status: planned, source: project_owned}
