[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e-emotion"
version = "0.1.0"
description = "2026 graduate mathematical modeling competition E题 project skeleton"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
data = ["openpyxl>=3.1"]
visualization = ["matplotlib>=3.8"]
test = ["pytest>=8.0"]
models = ["torch>=2.0"]

[project.scripts]
e-emotion = "e_emotion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
